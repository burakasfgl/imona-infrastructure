name: Deploy ECS

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: |
          docker build --no-cache -t imona-app ./sample-app
          docker tag imona-app:latest 584034201125.dkr.ecr.eu-central-1.amazonaws.com/imona-dev-app:v2
      - name: Push Image
        run: |
          docker push 584034201125.dkr.ecr.eu-central-1.amazonaws.com/imona-dev-app:v2

      - name: Force ECS Deployment
        run: |

          aws ecs update-service \
          --cluster imona-dev-cluster \
          --service imona-dev-service \
          --force-new-deployment